name: monitor
on:
  schedule: [{ cron: '*/15 * * * *' }]
  workflow_dispatch:
  push:
    branches: [main]
    paths: [web/**, scripts/**, config.json, .github/workflows/monitor.yml]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: monitor, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/selftest.mjs
      - name: Bangun data & situs
        run: node scripts/build.mjs
        env:
          SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}   # opsional: hanya untuk repo mesin yang privat
          GITHUB_TOKEN: ${{ github.token }}
      - name: Simpan arsip jurnal
        run: |
          git config user.name "monitor-bot"; git config user.email "monitor-bot@users.noreply.github.com"
          git add data/archive
          git diff --cached --quiet || (git commit -m "arsip $(date -u +%FT%TZ)" && git pull --rebase -q && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
