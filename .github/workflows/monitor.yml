name: monitor
on:
  schedule: [{ cron: '*/15 * * * *' }]
  workflow_dispatch:
  push:
    branches: [main]
    paths: [web/**, scripts/**, config.json, .github/workflows/monitor.yml]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: monitor, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/selftest.mjs
      - name: Bangun data & situs
        run: node scripts/build.mjs
        env:
          SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}   # opsional: hanya untuk repo mesin yang privat
          GITHUB_TOKEN: ${{ github.token }}
      - name: Simpan arsip jurnal
        run: |
          set -e
          git config user.name "monitor-bot"; git config user.email "monitor-bot@users.noreply.github.com"
          git add data/archive
          if git diff --cached --quiet; then echo "arsip tidak berubah"; exit 0; fi
          git commit -m "arsip $(date -u +%FT%TZ)"
          ok=0
          for i in 1 2 3; do                      # dicoba 3x: push bisa bentrok dengan commit lain
            if git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}"; then ok=1; break; fi
            echo "push gagal (percobaan $i)"; git rebase --abort 2>/dev/null || true; sleep $((i * 5))
          done
          if [ "$ok" != "1" ]; then echo "::error::Gagal menyimpan arsip setelah 3 percobaan"; exit 1; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
